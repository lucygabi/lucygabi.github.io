<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 480" role="img" aria-label="Ilustração abstrata de tecnologia governamental com IA: documento de parecer, escudo de verificação, nós conectados e camadas de dados">
  <defs>
    <!-- Gradients derived strictly from the site palette -->
    <linearGradient id="gBlue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="gCard" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#111a2e"/>
      <stop offset="1" stop-color="#0e1626"/>
    </linearGradient>
    <linearGradient id="gGreen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#10b981"/>
      <stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
    <radialGradient id="gGlowBlue" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#2563eb" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#2563eb" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="gGlowGreen" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#10b981" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#10b981" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>

    <style>
      /* All motion is subtle and GPU-friendly (transform/opacity). */
      .float-slow { animation: floatY 7s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      .float-mid  { animation: floatY 5.5s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      .float-fast { animation: floatY 4.5s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      .glow-pulse { animation: glowPulse 6s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      .node-pulse { animation: nodePulse 3.2s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      .node-pulse.d1 { animation-delay: .5s; }
      .node-pulse.d2 { animation-delay: 1.1s; }
      .node-pulse.d3 { animation-delay: 1.7s; }
      .node-pulse.d4 { animation-delay: 2.3s; }
      .draw { stroke-dasharray: 240; stroke-dashoffset: 240; animation: draw 3.2s ease-in-out forwards; }
      .draw.d1 { animation-delay: .3s; }
      .draw.d2 { animation-delay: .7s; }
      .draw.d3 { animation-delay: 1.1s; }
      .spark { animation: sparkTravel 4.5s linear infinite; }
      .spark.s2 { animation-delay: 1.5s; }
      .spark.s3 { animation-delay: 3s; }

      @keyframes floatY { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-9px); } }
      @keyframes glowPulse { 0%,100% { opacity: .5; } 50% { opacity: 1; } }
      @keyframes nodePulse { 0%,100% { opacity: .5; transform: scale(.85); } 50% { opacity: 1; transform: scale(1.15); } }
      @keyframes draw { to { stroke-dashoffset: 0; } }
      @keyframes sparkTravel { 0% { opacity: 0; } 10% { opacity: 1; } 90% { opacity: 1; } 100% { opacity: 0; } }

      @media (prefers-reduced-motion: reduce) {
        .float-slow, .float-mid, .float-fast, .glow-pulse, .node-pulse, .spark { animation: none; }
        .draw { stroke-dashoffset: 0; animation: none; }
      }
    </style>
  </defs>

  <!-- Ambient glows -->
  <circle class="glow-pulse" cx="150" cy="150" r="150" fill="url(#gGlowBlue)"/>
  <circle class="glow-pulse" cx="360" cy="330" r="140" fill="url(#gGlowGreen)" style="animation-delay:2s"/>

  <!-- Dotted grid accent -->
  <g fill="#3b82f6" opacity="0.16">
    <g id="dotcol">
      <circle cx="0" cy="0" r="1.6"/><circle cx="0" cy="26" r="1.6"/><circle cx="0" cy="52" r="1.6"/><circle cx="0" cy="78" r="1.6"/><circle cx="0" cy="104" r="1.6"/>
    </g>
    <use href="#dotcol" x="40" y="360"/><use href="#dotcol" x="66" y="360"/><use href="#dotcol" x="92" y="360"/>
    <use href="#dotcol" x="380" y="20"/><use href="#dotcol" x="406" y="20"/><use href="#dotcol" x="432" y="20"/>
  </g>

  <!-- Data layers (stacked, floating) -->
  <g class="float-slow" opacity="0.9">
    <rect x="70" y="330" width="150" height="26" rx="6" fill="url(#gCard)" stroke="#1e2a44"/>
    <rect x="82" y="316" width="150" height="26" rx="6" fill="url(#gCard)" stroke="#1e2a44"/>
    <rect x="94" y="302" width="150" height="26" rx="6" fill="url(#gCard)" stroke="#2563eb" stroke-opacity="0.5"/>
    <rect x="104" y="310" width="42" height="10" rx="5" fill="#3b82f6" opacity="0.7"/>
    <circle cx="222" cy="315" r="4" fill="#10b981"/>
  </g>

  <!-- Central document / parecer card -->
  <g class="float-mid">
    <rect x="150" y="120" width="180" height="220" rx="16" fill="url(#gCard)" stroke="#2563eb" stroke-opacity="0.5"/>
    <rect x="150" y="120" width="180" height="46" rx="16" fill="#2563eb" opacity="0.14"/>
    <circle cx="172" cy="143" r="6" fill="#10b981"/>
    <rect x="188" y="138" width="80" height="9" rx="4.5" fill="#3b82f6" opacity="0.8"/>
    <!-- document text lines -->
    <g fill="#9db0cc" opacity="0.55">
      <rect x="172" y="188" width="136" height="7" rx="3.5"/>
      <rect x="172" y="206" width="120" height="7" rx="3.5"/>
      <rect x="172" y="224" width="136" height="7" rx="3.5"/>
      <rect x="172" y="242" width="96" height="7" rx="3.5"/>
    </g>
    <!-- highlighted verified citation line -->
    <rect x="168" y="268" width="144" height="20" rx="6" fill="#10b981" opacity="0.12"/>
    <rect x="180" y="274" width="96" height="7" rx="3.5" fill="#10b981" opacity="0.9"/>
    <circle cx="298" cy="278" r="7" fill="none" stroke="#10b981" stroke-width="2"/>
    <path d="M295 278 l2.4 2.4 l4.2 -4.6" fill="none" stroke="#10b981" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <g fill="#9db0cc" opacity="0.4">
      <rect x="172" y="304" width="128" height="7" rx="3.5"/>
    </g>
  </g>

  <!-- Neural network / connected nodes -->
  <g class="float-fast">
    <g stroke="url(#gBlue)" stroke-width="2" fill="none" opacity="0.8">
      <path class="draw d1" d="M300 96 L360 140"/>
      <path class="draw d2" d="M360 140 L392 210"/>
      <path class="draw d1" d="M300 96 L392 210"/>
      <path class="draw d3" d="M392 210 L352 268"/>
      <path class="draw d2" d="M360 140 L410 170"/>
    </g>
    <!-- traveling data sparks along a link -->
    <circle class="spark" r="3" fill="#f0c34e">
      <animateMotion dur="4.5s" repeatCount="indefinite" path="M300 96 L360 140 L392 210"/>
    </circle>
    <circle class="spark s2" r="2.5" fill="#10b981">
      <animateMotion dur="4.5s" repeatCount="indefinite" path="M392 210 L352 268"/>
    </circle>

    <circle class="node-pulse d1" cx="300" cy="96" r="7" fill="#3b82f6"/>
    <circle class="node-pulse d2" cx="360" cy="140" r="9" fill="url(#gGreen)"/>
    <circle class="node-pulse d3" cx="392" cy="210" r="7" fill="#2563eb"/>
    <circle class="node-pulse d4" cx="410" cy="170" r="5" fill="#10b981"/>
    <circle class="node-pulse d2" cx="352" cy="268" r="6" fill="#3b82f6"/>
  </g>

  <!-- Verification shield -->
  <g class="float-mid" style="animation-delay:1s">
    <path d="M110 150 l40 -16 l40 16 v34 c0 30 -20 46 -40 56 c-20 -10 -40 -26 -40 -56 z"
          fill="url(#gCard)" stroke="#10b981" stroke-opacity="0.7" stroke-width="2"/>
    <path d="M110 150 l40 -16 l40 16 v34 c0 30 -20 46 -40 56 c-20 -10 -40 -26 -40 -56 z"
          fill="url(#gGlowGreen)" opacity="0.5"/>
    <path d="M133 186 l12 12 l22 -26" fill="none" stroke="#10b981" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Circuit accents -->
  <g stroke="#3b82f6" stroke-width="1.6" fill="none" opacity="0.35">
    <path class="draw d3" d="M40 220 h40 v-30 h30"/>
    <circle cx="40" cy="220" r="3" fill="#3b82f6" stroke="none"/>
    <circle cx="110" cy="190" r="3" fill="#10b981" stroke="none"/>
  </g>
</svg>
