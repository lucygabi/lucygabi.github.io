<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="gp-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6d28d9"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <filter id="gp-glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="200" height="200" fill="#0f0a2a" rx="20"/>
  <rect x="1" y="1" width="198" height="198" fill="none" stroke="#6d28d9" stroke-width="0.5" rx="20" opacity="0.2"/>
  <!-- Institutional building (simplified neoclassical) -->
  <!-- Pediment (triangle) -->
  <polygon points="100,38 60,62 140,62" fill="none" stroke="#6d28d9" stroke-width="1.8" stroke-linejoin="round"/>
  <circle cx="100" cy="52" r="4" fill="#6d28d9" opacity="0.5" filter="url(#gp-glow)"/>
  <!-- Entablature -->
  <line x1="56" y1="62" x2="144" y2="62" stroke="#6d28d9" stroke-width="2"/>
  <!-- Columns -->
  <line x1="70" y1="65" x2="70" y2="105" stroke="#6d28d9" stroke-width="2" stroke-linecap="round"/>
  <line x1="90" y1="65" x2="90" y2="105" stroke="#6d28d9" stroke-width="2" stroke-linecap="round"/>
  <line x1="110" y1="65" x2="110" y2="105" stroke="#6d28d9" stroke-width="2" stroke-linecap="round"/>
  <line x1="130" y1="65" x2="130" y2="105" stroke="#6d28d9" stroke-width="2" stroke-linecap="round"/>
  <!-- Base -->
  <line x1="56" y1="105" x2="144" y2="105" stroke="#6d28d9" stroke-width="2"/>
  <rect x="56" y="105" width="88" height="4" fill="#6d28d9" opacity="0.1" rx="1"/>
  <!-- Gear overlay (right side, partially behind building) -->
  <g transform="translate(132,88)" opacity="0.7">
    <circle cx="0" cy="0" r="18" fill="none" stroke="#10b981" stroke-width="1.5"/>
    <circle cx="0" cy="0" r="7" fill="none" stroke="#10b981" stroke-width="1.2"/>
    <circle cx="0" cy="0" r="2.5" fill="#10b981" opacity="0.5" filter="url(#gp-glow)"/>
    <!-- Gear teeth -->
    <line x1="0" y1="-18" x2="0" y2="-22" stroke="#10b981" stroke-width="2" stroke-linecap="round"/>
    <line x1="0" y1="18" x2="0" y2="22" stroke="#10b981" stroke-width="2" stroke-linecap="round"/>
    <line x1="-18" y1="0" x2="-22" y2="0" stroke="#10b981" stroke-width="2" stroke-linecap="round"/>
    <line x1="18" y1="0" x2="22" y2="0" stroke="#10b981" stroke-width="2" stroke-linecap="round"/>
    <line x1="-13" y1="-13" x2="-16" y2="-16" stroke="#10b981" stroke-width="2" stroke-linecap="round"/>
    <line x1="13" y1="-13" x2="16" y2="-16" stroke="#10b981" stroke-width="2" stroke-linecap="round"/>
    <line x1="-13" y1="13" x2="-16" y2="16" stroke="#10b981" stroke-width="2" stroke-linecap="round"/>
    <line x1="13" y1="13" x2="16" y2="16" stroke="#10b981" stroke-width="2" stroke-linecap="round"/>
  </g>
  <!-- Process flow arrows below building -->
  <path d="M65,120 L85,120" stroke="url(#gp-grad)" stroke-width="1.2" stroke-linecap="round"/>
  <path d="M83,117 L88,120 L83,123" fill="none" stroke="#10b981" stroke-width="1" stroke-linecap="round"/>
  <rect x="90" y="115" width="20" height="10" rx="3" fill="none" stroke="#10b981" stroke-width="1" opacity="0.5"/>
  <path d="M112,120 L132,120" stroke="url(#gp-grad)" stroke-width="1.2" stroke-linecap="round"/>
  <path d="M130,117 L135,120 L130,123" fill="none" stroke="#10b981" stroke-width="1" stroke-linecap="round"/>
  <!-- Data points (small dots representing metrics) -->
  <circle cx="70" cy="140" r="2" fill="#6d28d9" opacity="0.3"/>
  <circle cx="85" cy="148" r="2" fill="#6d28d9" opacity="0.25"/>
  <circle cx="100" cy="142" r="2" fill="#10b981" opacity="0.3"/>
  <circle cx="115" cy="150" r="2" fill="#10b981" opacity="0.25"/>
  <circle cx="130" cy="144" r="2" fill="#10b981" opacity="0.3"/>
  <!-- Subtle connecting lines between data points -->
  <polyline points="70,140 85,148 100,142 115,150 130,144" fill="none" stroke="url(#gp-grad)" stroke-width="0.6" opacity="0.25"/>
</svg>
