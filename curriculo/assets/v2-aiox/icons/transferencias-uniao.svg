<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="trf-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6d28d9"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <filter id="trf-glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="200" height="200" fill="#0f0a2a" rx="20"/>
  <!-- Subtle border -->
  <rect x="1" y="1" width="198" height="198" fill="none" stroke="#6d28d9" stroke-width="0.5" rx="20" opacity="0.2"/>
  <!-- Source node (Union - top center) -->
  <circle cx="100" cy="52" r="16" fill="#6d28d9" opacity="0.12"/>
  <circle cx="100" cy="52" r="16" fill="none" stroke="#6d28d9" stroke-width="1.8"/>
  <circle cx="100" cy="52" r="5" fill="#6d28d9" opacity="0.7" filter="url(#trf-glow)"/>
  <!-- Three flow paths diverging -->
  <path d="M90,66 Q70,90 55,110" fill="none" stroke="url(#trf-grad)" stroke-width="1.8" stroke-linecap="round" stroke-dasharray="4 3"/>
  <path d="M100,68 L100,110" fill="none" stroke="url(#trf-grad)" stroke-width="1.8" stroke-linecap="round" stroke-dasharray="4 3"/>
  <path d="M110,66 Q130,90 145,110" fill="none" stroke="url(#trf-grad)" stroke-width="1.8" stroke-linecap="round" stroke-dasharray="4 3"/>
  <!-- Arrow heads -->
  <path d="M51,106 L55,114 L59,106" fill="none" stroke="#10b981" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M96,106 L100,114 L104,106" fill="none" stroke="#10b981" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M141,106 L145,114 L149,106" fill="none" stroke="#10b981" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Destination nodes -->
  <circle cx="55" cy="132" r="12" fill="#10b981" opacity="0.08"/>
  <circle cx="55" cy="132" r="12" fill="none" stroke="#10b981" stroke-width="1.5"/>
  <circle cx="55" cy="132" r="3.5" fill="#10b981" opacity="0.6" filter="url(#trf-glow)"/>
  <circle cx="100" cy="132" r="12" fill="#10b981" opacity="0.08"/>
  <circle cx="100" cy="132" r="12" fill="none" stroke="#10b981" stroke-width="1.5"/>
  <circle cx="100" cy="132" r="3.5" fill="#10b981" opacity="0.6" filter="url(#trf-glow)"/>
  <circle cx="145" cy="132" r="12" fill="#10b981" opacity="0.08"/>
  <circle cx="145" cy="132" r="12" fill="none" stroke="#10b981" stroke-width="1.5"/>
  <circle cx="145" cy="132" r="3.5" fill="#10b981" opacity="0.6" filter="url(#trf-glow)"/>
  <!-- Connecting line between destinations (network) -->
  <line x1="67" y1="132" x2="88" y2="132" stroke="#10b981" stroke-width="0.8" opacity="0.3"/>
  <line x1="112" y1="132" x2="133" y2="132" stroke="#10b981" stroke-width="0.8" opacity="0.3"/>
  <!-- Secondary redistribution paths -->
  <path d="M55,144 Q55,158 75,162" fill="none" stroke="#10b981" stroke-width="0.8" opacity="0.25" stroke-dasharray="2 2"/>
  <path d="M145,144 Q145,158 125,162" fill="none" stroke="#10b981" stroke-width="0.8" opacity="0.25" stroke-dasharray="2 2"/>
  <path d="M100,144 L100,162" fill="none" stroke="#10b981" stroke-width="0.8" opacity="0.25" stroke-dasharray="2 2"/>
  <!-- Micro-dots (secondary destinations) -->
  <circle cx="75" cy="164" r="2.5" fill="#10b981" opacity="0.3"/>
  <circle cx="100" cy="164" r="2.5" fill="#10b981" opacity="0.3"/>
  <circle cx="125" cy="164" r="2.5" fill="#10b981" opacity="0.3"/>
</svg>
