<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="ad-grad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#6d28d9" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="ad-bar" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#6d28d9" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.7"/>
    </linearGradient>
    <filter id="ad-glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="200" height="200" fill="#0f0a2a" rx="20"/>
  <rect x="1" y="1" width="198" height="198" fill="none" stroke="#6d28d9" stroke-width="0.5" rx="20" opacity="0.2"/>
  <!-- Chart area -->
  <!-- Y axis -->
  <line x1="48" y1="40" x2="48" y2="140" stroke="#6d28d9" stroke-width="1.2" opacity="0.4"/>
  <!-- X axis -->
  <line x1="48" y1="140" x2="160" y2="140" stroke="#6d28d9" stroke-width="1.2" opacity="0.4"/>
  <!-- Horizontal grid lines -->
  <line x1="48" y1="65" x2="160" y2="65" stroke="#6d28d9" stroke-width="0.4" opacity="0.12"/>
  <line x1="48" y1="90" x2="160" y2="90" stroke="#6d28d9" stroke-width="0.4" opacity="0.12"/>
  <line x1="48" y1="115" x2="160" y2="115" stroke="#6d28d9" stroke-width="0.4" opacity="0.12"/>
  <!-- Bar chart (5 bars with rounded tops) -->
  <rect x="56" y="112" width="12" height="28" rx="3" fill="url(#ad-bar)"/>
  <rect x="76" y="88" width="12" height="52" rx="3" fill="url(#ad-bar)"/>
  <rect x="96" y="96" width="12" height="44" rx="3" fill="url(#ad-bar)"/>
  <rect x="116" y="72" width="12" height="68" rx="3" fill="url(#ad-bar)"/>
  <rect x="136" y="56" width="12" height="84" rx="3" fill="url(#ad-bar)"/>
  <!-- Trend line (smooth curve) -->
  <path d="M62,108 C72,95 78,84 82,82 C90,76 98,80 102,88 C108,78 116,68 122,66 C130,62 138,52 142,50"
        fill="none" stroke="#10b981" stroke-width="1.8" stroke-linecap="round"/>
  <!-- Trend area fill (below the line) -->
  <path d="M62,108 C72,95 78,84 82,82 C90,76 98,80 102,88 C108,78 116,68 122,66 C130,62 138,52 142,50 L142,140 L62,140 Z"
        fill="url(#ad-grad)" opacity="0.08"/>
  <!-- Data points on trend -->
  <circle cx="62" cy="108" r="3" fill="#0f0a2a" stroke="#10b981" stroke-width="1.5"/>
  <circle cx="62" cy="108" r="1.2" fill="#10b981" filter="url(#ad-glow)"/>
  <circle cx="82" cy="82" r="3" fill="#0f0a2a" stroke="#10b981" stroke-width="1.5"/>
  <circle cx="82" cy="82" r="1.2" fill="#10b981" filter="url(#ad-glow)"/>
  <circle cx="102" cy="88" r="3" fill="#0f0a2a" stroke="#10b981" stroke-width="1.5"/>
  <circle cx="102" cy="88" r="1.2" fill="#10b981" filter="url(#ad-glow)"/>
  <circle cx="122" cy="66" r="3" fill="#0f0a2a" stroke="#10b981" stroke-width="1.5"/>
  <circle cx="122" cy="66" r="1.2" fill="#10b981" filter="url(#ad-glow)"/>
  <circle cx="142" cy="50" r="3" fill="#0f0a2a" stroke="#10b981" stroke-width="1.5"/>
  <circle cx="142" cy="50" r="1.2" fill="#10b981" filter="url(#ad-glow)"/>
  <!-- Magnifying glass (top-right area) -->
  <circle cx="152" cy="42" r="11" fill="#0f0a2a" opacity="0.6"/>
  <circle cx="152" cy="42" r="11" fill="none" stroke="#6d28d9" stroke-width="1.8"/>
  <line x1="160" y1="50" x2="168" y2="58" stroke="#6d28d9" stroke-width="2.2" stroke-linecap="round"/>
  <!-- Lens highlight -->
  <path d="M146,36 C148,34 152,34 154,36" fill="none" stroke="#6d28d9" stroke-width="0.8" opacity="0.4"/>
  <!-- Insight indicator (small crosshair inside lens) -->
  <line x1="149" y1="42" x2="155" y2="42" stroke="#10b981" stroke-width="0.8" opacity="0.5"/>
  <line x1="152" y1="39" x2="152" y2="45" stroke="#10b981" stroke-width="0.8" opacity="0.5"/>
  <!-- Metric indicators below chart -->
  <circle cx="65" cy="156" r="2" fill="#10b981" opacity="0.3"/>
  <line x1="72" y1="156" x2="92" y2="156" stroke="#10b981" stroke-width="1" opacity="0.2" stroke-linecap="round"/>
  <circle cx="105" cy="156" r="2" fill="#6d28d9" opacity="0.3"/>
  <line x1="112" y1="156" x2="132" y2="156" stroke="#6d28d9" stroke-width="1" opacity="0.2" stroke-linecap="round"/>
</svg>
